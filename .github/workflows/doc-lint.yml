name: ドキュメント検査

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: doc-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: doc-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 執筆規約を検査する
        run: python3 doc-lint/lint.py .
